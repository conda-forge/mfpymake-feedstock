{% set name = "mfpymake" %}
{% set version = "2.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/mfpymake-{{ version }}.tar.gz
  sha256: b42c75baeb585d43f27b5453fcfa38630d91ca0b115fcab919ff6b91fcf2e6e2

build:
  entry_points:
    - mfpymake = pymake.cmds.mfpymakecli:main
    - make-program = pymake.cmds.build:main
    - make-code-json = pymake.cmds.createjson:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.3,<3.0
    - requests
    - networkx
    - meson >=1.3.1
    - ninja
    - pydot

test:
  requires:
    - python {{ python_min }}
  imports:
    - pymake
  commands:
    - mfpymake --help
    - make-program --help
    - make-code-json --help

about:
  home: https://github.com/modflowpy/pymake
  summary: pymake is a Python package to compile MODFLOW-based models.
  license: CC0-1.0
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - jdhughes-dev
    - wpbonelli
